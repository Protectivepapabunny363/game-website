<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayerPilot - Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="main.js"></script>
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px; /* Added space between screen and text */
            background-color: #0d0d0d;
            color: white;
            background-image: url('images/red-glitch-2.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Header Styles */
        header {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 25px #ff004c;
        }

        a {
            color: white;
            text-decoration: none;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            padding: 15px;
            background-color: #1a1a1a;
            border-bottom: 3px solid #ff004c;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: color 0.3s;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            left: 0;
            bottom: -5px;
            background-color: #ffcc00;
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a:hover {
            color: #ffcc00;
        }

        /* Game View */
        .game-view {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .back-button {
            display: inline-block;
            margin-left: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            min-height: 100vh;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            border-top: 3px solid #ff004c;
        }

        /* Auth Section */
        .auth-section {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 12px #ff004c;
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-section input,
        .auth-section button {
            background: #222;
            color: #fff;
            border: 1px solid #ff004c;
            border-radius: 4px;
            padding: 5px 8px;
        }

        .auth-section button:hover {
            background: #ff004c;
            color: black;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .auth-section {
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1><a href="home.html" style="font-family: 'Poppins', sans-serif;">PlayerPilot</a></h1>
            <h3><a href="home.html" style="font-family: 'Poppins', sans-serif;">Your Ultimate Gaming Hub</a></h3>

            <div id="login-section" class="auth-section">
                <input type="text" id="login-username" placeholder="Username">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="login()">Login</button>
                <button onclick="showRegisterModal()">Register</button>
            </div>

            <div id="user-section" class="auth-section" style="display:none">
                <span id="user-greeting"></span>
                <span id="user-streak"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </header>

        <main>
            <div id="game-container" class="game-view"></div>
        </main>

        <footer>
            <p>&copy; 2025 PlayerPilot v. 1.0. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // Get game parameter from URL
        function getGameFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('game');
        }

        // Load the game when page loads
        window.addEventListener('DOMContentLoaded', () => {
            const gameFile = getGameFromURL();
            if (gameFile) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                player.style.width = "800px";
                player.style.height = "600px";
                player.style.maxWidth = "100%";

                const container = document.getElementById("game-container");
                container.appendChild(player);

                player.load(`games/${gameFile}`).then(() => {
                    document.title = `PlayerPilot - ${gameFile.replace('.swf', '')}`;
                }).catch(error => {
                    console.error("Error loading game:", error);
                    container.innerHTML = `<p>Error loading game. Please try again.</p>`;
                });
            } else {
                document.getElementById("game-container").innerHTML = 
                    `<p>No game specified. Please select a game from the home page.</p>`;
            }
        });
    </script>
</body>
</html>
