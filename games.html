<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayerPilot - Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="main.js"></script>
    <style>
        .game-view {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .back-button {
            display: inline-block;
            margin-left: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>PlayerPilot</h1>
        <a href="home.html" class="back-button">← Back to Games</a>
    </header>
    
    <main>
        <div id="game-container" class="game-view"></div>
    </main>

    <footer>
        <p>&copy; 2025 PlayerPilot v. 1.0. All Rights Reserved.</p>
    </footer>

    <script>
        // Get game parameter from URL
        function getGameFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('game');
        }
        
        // Load the game when page loads
        window.addEventListener('DOMContentLoaded', () => {
            const gameFile = getGameFromURL();
            if (gameFile) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                player.style.width = "800px";
                player.style.height = "600px";
                player.style.maxWidth = "100%";
                
                const container = document.getElementById("game-container");
                container.appendChild(player);
                
                player.load(`games/${gameFile}`).then(() => {
                    document.title = `PlayerPilot - ${gameFile.replace('.swf', '')}`;
                }).catch(error => {
                    console.error("Error loading game:", error);
                    container.innerHTML = `<p>Error loading game. Please try again.</p>`;
                });
            } else {
                document.getElementById("game-container").innerHTML = 
                    `<p>No game specified. Please select a game from the home page.</p>`;
            }
        });
    </script>
</body>
</html>
